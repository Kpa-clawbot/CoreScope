# docker-compose.staging.no-mosquitto.yml — legacy staging override.
#
# AUDIENCE: kept for historical parity with pre-v3.7 staging shape and
# for local reproduction of "staging without an external broker". In
# most cases you want `docker-compose.staging.yml` instead — it is the
# CoreScope maintainers' actual staging deploy shape, and it already
# defaults `DISABLE_MOSQUITTO=true` (external broker on `meshcore-net`).
#
# Use this file ONLY if you are explicitly reproducing the legacy
# in-container-mosquitto staging shape (e.g. debugging a broker
# regression). Third-party single-host deploys should use
# `docker-compose.example.yml` (or `docker-compose.no-mosquitto.yml`
# for a prod-flavoured variant with an external broker).

name: corescope-staging

services:
  postgres:
    extends:
      file: docker/postgres.compose.yml
      service: postgres
    volumes:
      - ${STAGING_POSTGRES_DATA_DIR:-~/corescope-staging-postgres}:/var/lib/postgresql
  bootstrap:
    extends:
      file: docker/postgres.compose.yml
      service: bootstrap
    image: corescope-go:latest
    volumes:
      - ${STAGING_DATA_DIR:-~/meshcore-staging-data}:/app/data:ro
  staging-go:
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: corescope-go:latest
    container_name: corescope-staging-go
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    deploy:
      resources:
        limits:
          memory: 3g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STAGING_GO_HTTP_PORT:-82}:80"
      - "6060:6060"
      - "6061:6061"
    volumes:
      - ${STAGING_DATA_DIR:-~/meshcore-staging-data}:/app/data
      - caddy-data-staging-go:/data/caddy
    environment:
      - CORESCOPE_STATE_DIR=/app/data
      - CORESCOPE_READER_DATABASE_URL=postgresql://corescope_reader:${CORESCOPE_READER_PASSWORD:?Set CORESCOPE_READER_PASSWORD}@postgres/corescope_telemetry?sslmode=disable
      - CORESCOPE_WRITER_DATABASE_URL=postgresql://corescope_writer:${CORESCOPE_WRITER_PASSWORD:?Set CORESCOPE_WRITER_PASSWORD}@postgres/corescope_telemetry?sslmode=disable
      - CORESCOPE_USERS_DATABASE_URL=postgresql://corescope_accounts:${CORESCOPE_ACCOUNTS_PASSWORD:?Set CORESCOPE_ACCOUNTS_PASSWORD}@postgres/corescope_accounts?sslmode=disable
      - CORESCOPE_APPROVED_CHANNELS_DATABASE_URL=postgresql://corescope_channels:${CORESCOPE_CHANNELS_PASSWORD:?Set CORESCOPE_CHANNELS_PASSWORD}@postgres/corescope_accounts?sslmode=disable
      - NODE_ENV=staging
      - ENABLE_PPROF=true
      - DISABLE_MOSQUITTO=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  caddy-data-staging-go:
