<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — CoreScope</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      visibility: hidden;
    }
    body.authed { visibility: visible; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid #262626;
    }
    header h1 { font-size: 16px; font-weight: 600; margin: 0; }
    #who { font-size: 13px; color: #999; }
    #who strong { color: #e8e8e8; }
    button.link {
      background: none;
      border: none;
      color: #7aa5e8;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      margin-left: 12px;
    }
    main { max-width: 720px; margin: 0 auto; padding: 24px; }
    section { margin-bottom: 32px; }
    h2 { font-size: 14px; color: #999; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #1e1e1e; }
    th { color: #888; font-weight: 500; font-size: 12px; text-transform: uppercase; }
    .role-super_admin { color: #e8b84a; }
    .role-admin { color: #9ac0e8; }
    .disabled { color: #666; text-decoration: line-through; }
    form.add-admin { display: none; margin-top: 16px; padding: 16px; background: #141414; border: 1px solid #262626; border-radius: 8px; }
    form.add-admin.visible { display: block; }
    form.add-admin label { display: block; font-size: 13px; color: #999; margin: 0 0 6px; }
    form.add-admin input, form.add-admin select {
      width: 100%; padding: 8px 10px; margin-bottom: 12px;
      background: #1c1c1c; border: 1px solid #333; border-radius: 6px; color: #e8e8e8; font-size: 14px;
    }
    form.add-admin button {
      padding: 8px 16px; background: #3b6fc9; border: none; border-radius: 6px;
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #add-admin-error {
      display: none; background: #3a1a1a; border: 1px solid #6b2a2a; color: #f0a0a0;
      padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px;
    }
    #show-add-admin { padding: 6px 12px; background: #1c1c1c; border: 1px solid #333; border-radius: 6px; color: #e8e8e8; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>CoreScope Admin</h1>
    <div id="who"></div>
  </header>
  <main>
    <section>
      <h2>Admin Accounts</h2>
      <table>
        <thead>
          <tr><th>Username</th><th>Role</th><th>Created</th></tr>
        </thead>
        <tbody id="admins-table-body"></tbody>
      </table>

      <button id="show-add-admin" style="display:none; margin-top:16px;">+ Add admin</button>

      <form class="add-admin" id="add-admin-form">
        <div id="add-admin-error"></div>
        <label for="new-username">Username</label>
        <input type="text" id="new-username" required>
        <label for="new-password">Password</label>
        <input type="password" id="new-password" required>
        <label for="new-role">Role</label>
        <select id="new-role">
          <option value="admin">admin</option>
          <option value="super_admin">super_admin</option>
        </select>
        <button type="submit">Create admin</button>
      </form>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
