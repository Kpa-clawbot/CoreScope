<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login — CoreScope</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 340px;
      padding: 32px;
      margin: 16px;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 10px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 24px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 13px;
      color: #999;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #5a8fd6;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #3b6fc9;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4a7cd6; }
    button:disabled { opacity: 0.6; cursor: default; }
    .error {
      display: none;
      background: #3a1a1a;
      border: 1px solid #6b2a2a;
      color: #f0a0a0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CoreScope Admin</h1>
    <div class="error" id="error"></div>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" id="submit-btn">Log in</button>
    </form>
  </div>
  <script src="login.js"></script>
</body>
</html>
