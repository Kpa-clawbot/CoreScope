[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:corescope-server]
user=%(ENV_CORESCOPE_SERVER_USER)s
command=/bin/sh /server-exec.sh -config-dir /app -db %(ENV_CORESCOPE_SERVER_DB_PATH)s -public /app/public -port 3000
environment=DB_DSN="%(ENV_DB_DSN_SERVER)s"
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=2
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=/usr/sbin/caddy run --config /etc/caddy/Caddyfile
environment=XDG_DATA_HOME="/data",CADDY_ADMIN="%(ENV_CORESCOPE_CADDY_ADMIN)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
