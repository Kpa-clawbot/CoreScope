# Shared services extended by the deployment variants. Relative bind sources
# here resolve beside this file. Runtime services receive no owner password.
services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      CORESCOPE_OWNER_PASSWORD: ${CORESCOPE_OWNER_PASSWORD:?Set CORESCOPE_OWNER_PASSWORD}
      CORESCOPE_READER_PASSWORD: ${CORESCOPE_READER_PASSWORD:?Set CORESCOPE_READER_PASSWORD}
      CORESCOPE_WRITER_PASSWORD: ${CORESCOPE_WRITER_PASSWORD:?Set CORESCOPE_WRITER_PASSWORD}
      CORESCOPE_ACCOUNTS_PASSWORD: ${CORESCOPE_ACCOUNTS_PASSWORD:?Set CORESCOPE_ACCOUNTS_PASSWORD}
      CORESCOPE_CHANNELS_PASSWORD: ${CORESCOPE_CHANNELS_PASSWORD:?Set CORESCOPE_CHANNELS_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_DIR:-../postgres-data}:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-corescope.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  bootstrap:
    image: ${CORESCOPE_IMAGE:-corescope:latest}
    entrypoint: ["/bin/sh", "/app/postgres-bootstrap.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORESCOPE_DATABASE_URL: postgresql://corescope_owner:${CORESCOPE_OWNER_PASSWORD:?Set CORESCOPE_OWNER_PASSWORD}@postgres/corescope_telemetry?sslmode=disable
      CORESCOPE_USERS_DATABASE_URL: postgresql://corescope_owner:${CORESCOPE_OWNER_PASSWORD:?Set CORESCOPE_OWNER_PASSWORD}@postgres/corescope_accounts?sslmode=disable
      CORESCOPE_OWNER_PASSWORD: ${CORESCOPE_OWNER_PASSWORD:?Set CORESCOPE_OWNER_PASSWORD}
